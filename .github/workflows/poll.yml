name: NQ - escuchar comandos Telegram

on:
  schedule:
    - cron: '*/5 * * * *' # Cada 5 minutos
  workflow_dispatch:      # Para probar a mano

jobs:
  poll:
    runs-on: ubuntu-latest
    permissions:
      contents: write     # Necesario para guardar el offset en el repo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run poll
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python nq_bot.py poll
      - name: Save offset
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add state/tg_offset.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update telegram offset" && git push)