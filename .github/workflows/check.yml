name: NQ - avisos

on:
  schedule:
    - cron: "*/15 10-23 * * 1-5"   # cada 15 min, 5:00 am a 6:45 pm Bogotá
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nq-bot-state

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Revisar avisos pendientes
        run: python nq_bot.py check
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Guardar estado
        if: always()
        run: |
          git config user.name "nq-bot"
          git config user.email "nq-bot@users.noreply.github.com"
          git add state
          git diff --cached --quiet || (git commit -m "estado: avisos" && git pull --rebase && git push)
