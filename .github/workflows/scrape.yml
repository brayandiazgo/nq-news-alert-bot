name: NQ - leer calendario

on:
  schedule:
    - cron: "30 10 * * 1-5"   # 5:30 am Bogotá, lunes a viernes
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nq-bot-state

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt
      - run: playwright install --with-deps chromium

      - name: Leer Forex Factory y mandar resumen
        run: python nq_bot.py scrape
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Guardar estado
        if: always()
        run: |
          git config user.name "nq-bot"
          git config user.email "nq-bot@users.noreply.github.com"
          git add state
          git diff --cached --quiet || (git commit -m "estado: calendario" && git pull --rebase && git push)
