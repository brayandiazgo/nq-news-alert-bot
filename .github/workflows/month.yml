name: NQ - consultar mes

on:
  workflow_dispatch:
    inputs:
      next:
        description: 'Consultar próximo mes (en vez del actual)'
        required: false
        default: 'false'

jobs:
  month:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run month
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NEXT_MONTH: ${{ github.event.inputs.next }}
        run: |
          if [ "$NEXT_MONTH" = "true" ]; then
            python nq_bot.py month --next
          else
            python nq_bot.py month
          fi